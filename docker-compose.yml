services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lenscraft
      POSTGRES_USER: lenscraft
      POSTGRES_PASSWORD: lenscraft
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenscraft -d lenscraft"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/lenscraft
      DATABASE_USERNAME: lenscraft
      DATABASE_PASSWORD: lenscraft
      JWT_SECRET: change-this-development-secret-change-this
      ADMIN_EMAIL: admin@lenscraft.local
      ADMIN_PASSWORD: ChangeMe123!
      CORS_ORIGINS: http://localhost:5173,http://localhost:8081
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8080/api
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  postgres-data:
